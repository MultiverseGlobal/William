services:
  - type: web
    name: orion-server
    plan: free
    env: node
    buildCommand: npm install && npm run build -w @orion/server
    startCommand: npm run start -w @orion/server
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
